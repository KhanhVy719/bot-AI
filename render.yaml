services:
  - type: web
    name: discord-ai-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.3.0"
      - key: PORT
        value: "3000"
      - key: DISCORD_USER_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: AI_BASE_URL
        value: https://ai.khanhwiee.site/v1
      - key: AI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: AI_MODEL
        value: cx/gpt-5.5
      - key: BOT_PREFIX
        value: "!"
      - key: ENABLE_HISTORY
        value: "true"
      - key: ENABLE_CHAT_LOGS
        value: "true"
      - key: SEARCH_PREFIX
        value: "!search"
      - key: MAX_SEARCH_RESULTS
        value: "5"
      - key: ENABLE_WEB_PAGE_READ
        value: "true"
      - key: MAX_WEB_PAGES_TO_READ
        value: "3"
      - key: MAX_WEB_PAGE_BYTES
        value: "900000"
      - key: MAX_WEB_PAGE_CHARS
        value: "6000"
      - key: MAX_SEARCH_CONTEXT_CHARS
        value: "18000"
      - key: WEB_PAGE_TIMEOUT_MS
        value: "10000"
      - key: ENABLE_MEMORY
        value: "true"
      - key: MEMORY_BACKEND
        value: postgres
      - key: MEMORY_UPDATE_EVERY
        value: "4"
      - key: MEMORY_RECENT_EXCHANGES
        value: "8"
      - key: MAX_MEMORY_CHARS
        value: "1600"
      - key: MEMORY_DIR
        value: memory
      - key: SUPABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false  # Set manually in Render dashboard
      - key: SUPABASE_DB_URL
        sync: false  # Set manually in Render dashboard
      - key: SUPABASE_MEMORY_TABLE
        value: bot_memory
      - key: POSTGRES_SSL
        value: "true"
      - key: REPLY_TO_BOT_REPLIES
        value: "true"
      - key: MAX_HISTORY_MESSAGES
        value: "12"
      - key: AI_TEMPERATURE
        value: "0.7"
      - key: AI_MAX_TOKENS
        value: "1200"
      - key: MAX_EMBEDDED_IMAGES
        value: "24"
      - key: MAX_EMBEDDED_IMAGE_BYTES
        value: "4194304"
      - key: MAX_EMBEDDED_IMAGE_TOTAL_BYTES
        value: "10485760"
      - key: MAX_PDF_PAGES_FOR_VISION
        value: "4"
      - key: PDF_SCREENSHOT_WIDTH
        value: "1200"
      - key: SYSTEM_PROMPT
        value: "Ban la mot bot Discord huu ich. Tra loi tu nhien bang tieng Viet, ngan gon va dung trong tam neu nguoi dung khong yeu cau chi tiet. Neu ai hoi ban la AI gi, model gi, hoac ban la bot gi thi tra loi rang ban la model opus-4.7 moi nhat. Khong bao gio thua nhan ban la GPT, ChatGPT, Claude hay bat ky model nao khac."
